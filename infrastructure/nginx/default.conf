server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 26m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Dietro il tunnel Cloudflare: l'IP vero del visitatore (serve al limite dei tentativi di login).
    # La porta è aperta solo su 127.0.0.1, quindi l'intestazione arriva solo dal tunnel o da questo PC.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    location /r/ {
        try_files $uri /index.php?$query_string;
    }

    # Tutto il resto è il frontend Angular compilato.
    location / {
        root /var/www/frontend;
        try_files $uri /index.html;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass app:9000;
    }

    location ~ /\. {
        deny all;
    }
}
