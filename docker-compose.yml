services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - uploads:/var/www/storage
    networks: [marketing]

  # Applica le migrazioni del database e poi esegue i lavori in coda (generazione AI).
  worker: &worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    command: ["sh", "-c", "php bin/migrate.php && exec php bin/worker.php"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - uploads:/var/www/storage
    networks: [marketing]

  # Secondo worker: due lavori (analisi di siti, campagne, video) vanno avanti insieme invece di fare la fila.
  # Non applica le migrazioni e non fa i controlli periodici: ci pensa il primo.
  worker-2:
    <<: *worker
    command: ["php", "bin/worker.php"]
    environment:
      WORKER_PERIODIC: "0"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Solo da questo PC: da fuori si arriva passando dal tunnel Cloudflare.
      - "127.0.0.1:8088:80"
    volumes:
      - ./backend:/var/www/html:ro
      # Frontend compilato con `npx ng build` (cartella frontend).
      - ./frontend/dist/frontend/browser:/var/www/frontend:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [marketing]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [marketing]

volumes:
  mysql_data:
  uploads:

networks:
  marketing:
    driver: bridge
